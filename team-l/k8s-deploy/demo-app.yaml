apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
      - name: web
        image: nginx:alpine # Real, public, lightweight image
        ports:
        - containerPort: 80

